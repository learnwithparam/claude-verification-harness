name: Feature
description: A new capability.
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should this do, and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable statement per line; factory-plan turns these into AC-n.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this should deliberately not cover.
  - type: markdown
    attributes:
      value: |
        This only sets the `feature` label. Add `factory:ready` once it is
        triaged and you want the factory to pick it up.
