name: Docs
description: Documentation only, no code change.
labels: ["docs"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is missing, wrong, or unclear
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where this should live
      description: The file or page, if you know it.
  - type: markdown
    attributes:
      value: |
        This only sets the `docs` label. Add `factory:ready` once it is
        triaged and you want the factory to pick it up.
